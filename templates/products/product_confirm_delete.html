{% extends "base.html" %}

{% block title %}Confirm Delete | AeroMart{% endblock %}

{% block content %}
<div class="max-w-md mx-auto my-12">
    <div class="bg-white border border-slate-200 rounded-3xl p-6 shadow-sm text-center">
        <div class="w-12 h-12 rounded-full bg-rose-50 text-rose-600 flex items-center justify-center mx-auto mb-4">
            <i data-lucide="alert-triangle" class="w-6 h-6"></i>
        </div>
        <h2 class="text-lg font-bold text-slate-900">Delete Product?</h2>
        <p class="text-xs text-slate-500 mt-2 mb-6">
            Are you sure you want to delete <span class="font-bold text-slate-800">"{{ product.title }}"</span>? This action cannot be undone.
        </p>

        <form method="POST" class="flex items-center justify-center gap-3">
            {% csrf_token %}
            <a href="{% url 'seller_dashboard' %}" class="px-4 py-2 rounded-xl text-xs font-semibold text-slate-700 bg-slate-100 hover:bg-slate-200">
                Cancel
            </a>
            <button type="submit" class="px-5 py-2 rounded-xl text-xs font-bold text-white bg-rose-600 hover:bg-rose-700 shadow-sm">
                Yes, Delete
            </button>
        </form>
    </div>
</div>
{% endblock %}
